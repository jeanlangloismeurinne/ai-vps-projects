# RECLASSEMENTS PROPRES À UN ÉMETTEUR — le complément du gabarit maison (`socle_comptes.yaml`).
#
# Comme dans un fonds : la convention est maison et commune (« tout financement qui porte intérêt est
# de la dette »), mais l'analyste qui construit le modèle d'une société reclasse les postes qu'ELLE
# présente de façon atypique, et l'écrit dans sa note ; le directeur de la recherche le revoit. Ce n'est
# pas un vote du comité (arbitrage de l'utilisateur, 2026-10-04).
#
# Pourquoi un fichier à part et non une recette du gabarit (#31) : le même concept comptable veut dire
# autre chose chez un autre émetteur. `AccruedRoyaltiesCurrentAndNoncurrent` est, chez RVMD, la dette
# née de la cession de ses redevances futures à Royalty Pharma ; chez un industriel, ce sont des
# redevances dues à un concédant de licence — un passif d'exploitation. L'écrire dans le gabarit ferait
# de la dette chez tout le monde.
#
# Clé : le CIK (l'identité de l'émetteur à la SEC, jamais un sigle — #86). Chaque reclassement porte
# la ligne du gabarit qu'il alimente (une ligne `recettes_par_emetteur`), les concepts déposés, le
# MOTIF et la PIÈCE qui le justifient : un reclassement sans motif ni pièce est refusé au chargement.

emetteurs:

  "1628171":   # Revolution Medicines, Inc. (RVMD)
    - ligne: financement_adosse_aux_redevances
      concepts: [AccruedRoyaltiesCurrentAndNoncurrent]
      motif: >-
        Accord avec Royalty Pharma (2025) : les fonds reçus contre une part des redevances futures
        sont comptabilisés comme une dette (cession de revenus futurs, ASC 470-10), qui porte des
        intérêts non décaissés capitalisés — 24,2 M$ en 2025 (PaidInKindInterest), avant toute
        autre dette. Convention maison : un financement qui porte intérêt est de la dette. Inscrit en
        non courant (aucune échéance à douze mois déposée).
      piece: https://www.sec.gov/Archives/edgar/data/1628171/000119312526071563/0001193125-26-071563-index.htm

  "1045810":   # NVIDIA Corporation (NVDA)
    - ligne: participations
      concepts: [EquitySecuritiesWithoutReadilyDeterminableFairValueAmount]
      motif: >-
        NVIDIA présente ses participations non cotées (dont OpenAI et des sociétés de son écosystème) dans
        les « autres actifs » non courants, sans ligne propre au bilan : 22,3 Md$ au 25/01/2026, 47,9 Md$
        au 26/07/2026 (concept déposé sans interruption depuis le 29/01/2023). Leurs réévaluations et
        plus-values sont sous le résultat d'exploitation (« autres produits », 9,0 Md$ sur l'exercice
        2026) : convention maison, elles sortent du capital employé. Ce n'est pas une recette du gabarit :
        chez Microsoft, les mêmes titres sont déjà dans les placements à long terme.
      piece: https://www.sec.gov/Archives/edgar/data/1045810/000104581026000075/0001045810-26-000075-index.htm
    - ligne: participations_courantes
      concepts: [EquitySecuritiesFvNi]
      motif: >-
        NVIDIA range ses titres de participation COTÉS dans les « charges payées d'avance et autres actifs
        courants » : 12,9 Md$ au 25/01/2026, 42,8 Md$ au 26/07/2026 (le solde des autres actifs courants,
        une fois ces titres retirés, retombe sur les charges payées d'avance déposées). Leurs variations de
        valeur sont hors exploitation : convention maison, ils sortent du capital employé.
      piece: https://www.sec.gov/Archives/edgar/data/1045810/000104581026000075/0001045810-26-000075-index.htm
