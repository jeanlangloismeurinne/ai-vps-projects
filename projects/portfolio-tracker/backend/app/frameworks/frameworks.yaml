# Les frameworks et leurs questions — DÉTENTEUR UNIQUE (chantier v3, lot 2 ; pilotes puis roadmap 05).
#
# POURQUOI CE FICHIER N'EST PAS DU PYTHON. L'ordre imposé du chantier est UX → agent → données :
# les questions se dérivent d'une méthodologie (Greenwald, Porter), jamais de ce que la base
# contient déjà. En Python, rien n'empêcherait d'écrire `ingredients_requis` par compréhension sur
# `MVDD_SPEC` ou sur les postes EDGAR — et le test de couverture mesurerait alors sa propre
# constante (4ᵉ faux vert, `feedback_test_negatif_trois_faux_verts`). En YAML, les questions sont
# du texte inerte : la seule façon de les faire coïncider avec le corpus est de les écrire à la
# main, ce qui se lit dans le diff.
#
# RÈGLE D'ÉNONCÉ (§2.3) — une question se pose en SUBSTANCE ÉCONOMIQUE, jamais en artefact
# comptable. « Le capital employé rapporte-t-il plus que son coût ? » traverse les secteurs ;
# « quel est le ROIC ? » ne traverse pas une biotech. La même règle s'applique aux
# `ingredients_requis` : ils nomment ce dont la question a BESOIN, jamais une entry du corpus.
# Un ingrédient qui nommerait une entry (« #33 », « notes annexes NVDA ») écrirait le corrigé.
#
# ⚠️ Ce fichier ne contient AUCUN seuil de couverture et AUCUN compte d'orphelines. La couverture
# est un RÉSULTAT mesuré par `tools/couverture_frameworks.py`, pas un objectif inscrit ici.
#
# Contrat qui le valide : `app/contracts/framework_definition_schema.py` (strict, extra interdit).
# Gardé par `checks/check_frameworks_definitions.py` + `checks/negatif_frameworks_definitions.sh`.

schema_version: "v3.0.0"

archetypes:
  - rentable
  - pre_revenus
  - financiere

# ═══════════════════════════════════════════════════════════════════════════════════════════════
# TYPES D'ÉVÉNEMENT — ce qu'un fait publié par l'émetteur peut ROUVRIR (#89, arbitrage du 2026-09-26)
#
# Un vrai fonds ne refait pas tout le dossier à chaque communiqué, et ne laisse jamais un point touché
# affiché comme à jour. Chaque question déclare donc, plus bas, les types qui la rouvrent
# (`rouverte_par`) : CRÉER UN FRAMEWORK, C'EST AUSSI DÉCIDER CE QUI ROUVRE CHACUNE DE SES QUESTIONS.
#
# `portee` :
#   questions_declarees — rouvre les seules questions qui listent ce type ;
#   toutes              — rouvre toute question, sans qu'aucune ait à le lister (l'entreprise
#                         analysée a changé, ou personne n'a encore lu le communiqué) ;
#   aucune              — ne rouvre rien ; une question ne peut pas le lister.
# Qualification par la FORME du dépôt : `knowledge/evenements.py` (table item 8-K → type). Ce qui ne
# s'y décide pas est `a_qualifier`, de portée totale : dans le doute, on rouvre (arbitrage Q3).
# Limite nommée : les événements EXTÉRIEURS à l'émetteur (concurrent, régulateur sectoriel) ne sont
# pas dans ses dépôts. Ils sont DÉCLARÉS ci-dessous (origine `exterieur`, #93) mais aucun veilleur ne
# les repère encore.
#
# `types_evenement_version` — la version de CE catalogue, distincte de `schema_version` (#90). Une note
# flash est la lecture d'un dépôt contre ce catalogue, une fois par version : changer un libellé ici
# fait RELIRE les dépôts, sans toucher aux réponses des méthodologies.
#   1.0.0 — maillon 1 (#89) ; les six premières notes RVMD (#66-#71) ont été écrites sous « v3.0.0 »,
#           avant que la version du catalogue ne soit séparée de celle du référentiel.
#   1.1.0 — libellés désambiguïsés après lecture de ces notes : « résultats » = résultats FINANCIERS
#           (#71 y rangeait des données cliniques de phase 1) ; un essai clinique qui atteint son objectif
#           est une décision réglementaire / produit favorable (#69 rangeait le succès de phase 3 en
#           « écart aux attentes », ce qui rouvrait toute la qualité financière).
#   Ajout des types d'origine `exterieur` (#93) SANS changer la version : la version date ce que le
#   LECTEUR d'un dépôt voit, et il ne voit que les types `emetteur` — inchangés. Les monter aurait
#   fait relire les dépôts pour un catalogue identique à leurs yeux.
#
# `origine` (#93) : `emetteur` = publié par l'entreprise elle-même, lu par la note flash ;
# `exterieur` = survenu chez un concurrent ou dans le secteur, toujours `questions_declarees`.
types_evenement_version: "1.1.0"
types_evenement:
  - id: routine
    libelle: Dépôt de pure forme — pièces jointes, vote ordinaire, statuts
    portee: aucune
    origine: emetteur
  - id: gouvernance
    libelle: Départ ou nomination de dirigeants — aucune méthodologie ne le porte encore
    portee: aucune
    origine: emetteur
  - id: a_qualifier
    libelle: Communiqué dont la forme ne dit pas la substance — à lire avant de conclure
    portee: toutes
    origine: emetteur
  - id: perimetre
    libelle: Acquisition, cession, fusion ou scission — l'entreprise analysée n'est plus la même
    portee: toutes
    origine: emetteur
  - id: existentiel
    libelle: Faillite, changement de contrôle, radiation, dette rendue exigible
    portee: toutes
    origine: emetteur
  - id: financement
    libelle: Dette, obligation convertible, émission d'actions, ligne de crédit
    portee: questions_declarees
    origine: emetteur
  - id: resultats
    libelle: Publication des résultats FINANCIERS périodiques (trimestre, exercice) conformes aux attentes — pas des résultats cliniques
    portee: questions_declarees
    origine: emetteur
  - id: surprise_secteur
    libelle: Écart aux attentes dont la cause est commune au secteur (demande, cycle, change)
    portee: questions_declarees
    origine: emetteur
  - id: surprise_concurrence
    libelle: Écart aux attentes propre à l'entreprise — parts perdues, prix cassés, client qui internalise ; aussi quand la cause n'est pas dite
    portee: questions_declarees
    origine: emetteur
  - id: surprise_execution
    libelle: Écart aux attentes dû à l'exécution interne — retard, usine, produit
    portee: questions_declarees
    origine: emetteur
  - id: reglementaire_favorable
    libelle: Approbation d'un produit, décision réglementaire favorable, ou essai clinique qui atteint son objectif
    portee: questions_declarees
    origine: emetteur
  - id: reglementaire_defavorable
    libelle: Refus, échec d'essai, retrait ou rappel d'un produit
    portee: questions_declarees
    origine: emetteur
  - id: accord_commercial
    libelle: Licence, partenariat, contrat avec un client important, ou leur résiliation
    portee: questions_declarees
    origine: emetteur
  - id: integrite_comptes
    libelle: Comptes antérieurs déclarés non fiables, changement de commissaire aux comptes
    portee: questions_declarees
    origine: emetteur
  - id: incident
    libelle: Incident de cybersécurité, accident, litige majeur
    portee: questions_declarees
    origine: emetteur
  # ── Extérieurs à l'émetteur (#93, arbitrage A du 2026-09-28) ─────────────────────────────────────
  # Déclarés pour que le framework « Secteur et concurrence » dise ce qu'ils rouvrent. ⚠️ AUCUN
  # veilleur ne les repère encore : ils ne viennent pas des dépôts de l'émetteur, et la note flash ne
  # les voit pas (`note_flash.types_proposables`). Tant que le veilleur n'existe pas, ils ne rouvrent
  # rien EN PRATIQUE — limite nommée, pas une garantie.
  - id: concurrent_offensive
    libelle: Chez un concurrent — approbation ou lancement d'un produit concurrent, baisse de prix, hausse de capacités
    portee: questions_declarees
    origine: exterieur
  - id: concurrent_revers
    libelle: Chez un concurrent — échec d'essai, refus, retrait de produit, sortie du marché
    portee: questions_declarees
    origine: exterieur
  - id: concurrent_rapprochement
    libelle: Dans le secteur — fusion ou acquisition entre concurrents, ou rachat d'un concurrent par un tiers
    portee: questions_declarees
    origine: exterieur
  - id: regulation_du_secteur
    libelle: Dans le secteur — réforme qui touche les prix ou les règles de tous les acteurs (négociation des prix, restriction d'exportation, nouvelle norme)
    portee: questions_declarees
    origine: exterieur

frameworks:

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  - id: qualite_financiere
    libelle: Qualité financière
    etape_benchmark: 5
    methodologie: >-
      Greenwald — earnings quality et Earnings Power Value. La qualité d'un business se lit à la
      relation entre le capital qu'il immobilise, le rendement qu'il en tire, et la part de ce
      rendement qui devient du cash disponible. Les niveaux comptables ne disent rien seuls ; ce
      sont les relations et leur persistance qui informent.
    nature_dominante: mesure
    # Le chapitre de la note de comité que ce framework PROJETTE (§6). C'est la SEULE déclaration
    # nécessaire pour qu'un chapitre cesse d'être « sans méthodologie approuvée » : ajouter une
    # méthodologie est une opération de données, jamais de code.
    bloc_memo: financials
    questions:

      - id: qf_1
        enonce: Le capital employé rapporte-t-il durablement plus que son coût ?
        chemin_indexation: qualite_financiere.rendement_du_capital
        nature_attendue: mesure
        plancher_tier: A
        rouverte_par: [resultats, surprise_secteur, surprise_concurrence, surprise_execution, integrite_comptes]
        sens_admis: [cree_de_la_valeur, a_l_equilibre, detruit_de_la_valeur]
        ingredients_requis:
          - id: resultat_operationnel_apres_impot
            libelle: Résultat d'exploitation après impôt, normalisé des éléments non récurrents
            essentiel: true
          - id: capital_employe
            libelle: Capital immobilisé dans l'exploitation — actifs productifs et besoin en fonds de roulement, hors trésorerie excédentaire
            essentiel: true
          - id: taux_imposition_effectif
            libelle: Taux d'imposition réellement supporté sur le résultat d'exploitation
            essentiel: false
          - id: cout_du_capital
            libelle: Coût moyen des ressources qui financent ce capital — rémunération exigée par les créanciers et par les actionnaires
            essentiel: true
          - id: historique_cinq_exercices
            libelle: La même relation observée sur au moins cinq exercices consécutifs
            essentiel: false
        variables_par_archetype:
          rentable:
            mode: variable
            variable: Rendement du capital employé comparé au coût moyen pondéré des ressources, sur 5 ans
          pre_revenus:
            mode: sans_objet
            motif_gabarit: >-
              Sans exploitation qui immobilise du capital productif, la question n'a pas d'objet.
              Le capital levé finance un programme, il ne tourne pas.
            aucun_substitut: true
          financiere:
            mode: variable
            variable: Rendement des fonds propres réglementaires comparé au coût des fonds propres

      - id: qf_2
        enonce: Le résultat comptable se transforme-t-il en cash ?
        chemin_indexation: qualite_financiere.conversion_en_cash
        nature_attendue: mesure
        plancher_tier: A
        rouverte_par: [resultats, surprise_secteur, surprise_concurrence, surprise_execution, integrite_comptes]
        sens_admis: [conversion_forte, conversion_partielle, conversion_absente]
        ingredients_requis:
          - id: resultat_net
            libelle: Résultat net de l'exercice
            essentiel: true
          - id: tresorerie_generee_par_exploitation
            libelle: Trésorerie effectivement générée par l'exploitation sur le même exercice
            essentiel: true
          - id: variation_besoin_fonds_roulement
            libelle: Variation du besoin en fonds de roulement — ce que la croissance immobilise en stocks et en créances
            essentiel: false
          - id: charges_sans_decaissement
            libelle: Charges qui n'ont donné lieu à aucune sortie de trésorerie — amortissements, rémunération en actions, provisions
            essentiel: false
        variables_par_archetype:
          rentable:
            mode: variable
            variable: Part du résultat net retrouvée en trésorerie d'exploitation, moyenne sur 3 ans
          pre_revenus:
            mode: sans_objet
            motif_gabarit: >-
              Un résultat structurellement négatif ne se « convertit » pas. La question devient
              celle de la consommation de trésorerie, portée par une autre question.
            substitut_question_id: qf_7
          financiere:
            mode: variable
            variable: Part du résultat retrouvée en trésorerie, retraitée des variations de provisions techniques

      - id: qf_3
        enonce: La croissance coûte-t-elle du capital, et combien par point de croissance ?
        chemin_indexation: qualite_financiere.cout_de_la_croissance
        nature_attendue: mesure
        plancher_tier: A
        rouverte_par: [resultats, surprise_secteur, surprise_concurrence, surprise_execution, integrite_comptes]
        sens_admis: [croissance_peu_capitalistique, croissance_capitalistique, croissance_destructrice]
        ingredients_requis:
          - id: croissance_activite_par_exercice
            libelle: Progression de l'activité, exercice par exercice
            essentiel: true
          - id: investissement_de_maintien
            libelle: Part de l'investissement nécessaire au seul maintien de la capacité existante
            essentiel: true
          - id: investissement_de_croissance
            libelle: Part de l'investissement engagée pour accroître la capacité
            essentiel: true
          - id: variation_capital_employe
            libelle: Variation du capital immobilisé dans l'exploitation sur la période de croissance
            essentiel: false
        variables_par_archetype:
          rentable:
            mode: variable
            variable: Capital supplémentaire immobilisé par point de croissance de l'activité
          pre_revenus:
            mode: sans_objet
            motif_gabarit: >-
              Sans base d'activité, le rapport entre capital engagé et croissance n'est pas
              défini : tout le capital est de la croissance.
            aucun_substitut: true
          financiere:
            mode: variable
            variable: Fonds propres réglementaires supplémentaires exigés par point de croissance des encours

      - id: qf_4
        enonce: La structure de financement contraint-elle les décisions d'exploitation ?
        chemin_indexation: qualite_financiere.contrainte_de_financement
        nature_attendue: mesure
        plancher_tier: A
        rouverte_par: [financement, resultats, surprise_secteur, surprise_concurrence, surprise_execution, integrite_comptes]
        sens_admis: [aucune_contrainte, contrainte_moderee, contrainte_forte]
        ingredients_requis:
          - id: endettement_brut_et_net
            libelle: Endettement financier, brut et net de trésorerie
            essentiel: true
          - id: echeancier_de_la_dette
            libelle: Répartition dans le temps des remboursements exigibles
            essentiel: true
          - id: clauses_de_sauvegarde
            libelle: Engagements contractuels pris envers les prêteurs, et les seuils qui les déclenchent
            essentiel: true
          - id: lignes_de_credit_non_tirees
            libelle: Capacité de financement disponible mais non utilisée
            essentiel: false
          - id: couverture_des_interets
            libelle: Rapport entre le résultat d'exploitation et la charge d'intérêts
            essentiel: false
        variables_par_archetype:
          rentable:
            mode: variable
            variable: Endettement net rapporté à la capacité bénéficiaire, et marge disponible avant déclenchement des clauses
          pre_revenus:
            mode: variable
            variable: Dilution attendue et clauses attachées aux instruments convertibles
          financiere:
            mode: variable
            variable: Ratios prudentiels et marge au-dessus des exigences réglementaires

      - id: qf_5
        enonce: Le rendement observé est-il stable, en amélioration, ou en érosion sur cinq ans ou plus ?
        chemin_indexation: qualite_financiere.trajectoire_du_rendement
        nature_attendue: mesure
        plancher_tier: A
        rouverte_par: [resultats, surprise_secteur, surprise_concurrence, surprise_execution, integrite_comptes]
        sens_admis: [en_amelioration, stable, en_erosion]
        ingredients_requis:
          - id: serie_longue_du_rendement
            libelle: Le rendement du capital observé sur au moins cinq exercices consécutifs
            essentiel: true
          - id: decomposition_marge_rotation
            libelle: Décomposition du rendement entre marge dégagée et rotation du capital
            essentiel: true
          - id: comparaison_sectorielle
            libelle: Le même rendement chez des entreprises comparables, sur la même période
            essentiel: false
        variables_par_archetype:
          rentable:
            mode: variable
            variable: Pente du rendement du capital sur 5 ans, décomposée marge × rotation
          pre_revenus:
            mode: sans_objet
            motif_gabarit: >-
              Aucune série de rendement n'existe : la trajectoire à observer est celle de
              l'avancement du programme, pas celle d'un rendement.
            aucun_substitut: true
          financiere:
            mode: variable
            variable: Pente du rendement des fonds propres sur 5 ans, retraitée du levier réglementaire

      - id: qf_6
        enonce: Quelle part du résultat relève de choix discrétionnaires plutôt que de la performance économique ?
        chemin_indexation: qualite_financiere.discretion_comptable
        nature_attendue: interpretation
        plancher_tier: B+
        rouverte_par: [resultats, surprise_secteur, surprise_concurrence, surprise_execution, integrite_comptes]
        sens_admis: [part_faible, part_significative, part_dominante]
        ingredients_requis:
          - id: provisions_et_depreciations
            libelle: Provisions constituées ou reprises, et dépréciations d'actifs, avec leur justification
            essentiel: true
          - id: politique_de_capitalisation
            libelle: Dépenses portées à l'actif plutôt qu'en charges, et la règle qui décide du partage
            essentiel: true
          - id: ecart_publie_ajuste
            libelle: Écart entre le résultat publié et le résultat présenté comme ajusté, poste par poste
            essentiel: true
          - id: elements_non_recurrents
            libelle: Éléments présentés comme exceptionnels, et leur récurrence effective
            essentiel: false
        variables_par_archetype:
          rentable:
            mode: variable
            variable: Part du résultat expliquée par des reprises de provisions, des capitalisations et des retraitements
          pre_revenus:
            mode: variable
            variable: Traitement des dépenses de développement et des paiements d'étape
          financiere:
            mode: variable
            variable: Part du résultat expliquée par la dotation ou la reprise du coût du risque

      - id: qf_7
        enonce: Combien de temps l'entreprise peut-elle tenir sans accès au marché des capitaux ?
        chemin_indexation: qualite_financiere.autonomie_de_financement
        nature_attendue: mesure
        plancher_tier: A
        rouverte_par: [financement, resultats, surprise_secteur, surprise_concurrence, surprise_execution, integrite_comptes, reglementaire_defavorable]
        sens_admis: [autonomie_longue, autonomie_limitee, autonomie_critique]
        ingredients_requis:
          - id: tresorerie_disponible
            libelle: Trésorerie et placements immédiatement mobilisables
            essentiel: true
          - id: consommation_de_tresorerie_recente
            libelle: Trésorerie consommée ou générée sur les quatre derniers trimestres
            essentiel: true
          - id: charges_fixes_decaissables
            libelle: Charges qui devront être décaissées quoi qu'il arrive sur les douze prochains mois
            essentiel: true
          - id: echeances_a_douze_mois
            libelle: Dettes exigibles dans les douze prochains mois
            essentiel: true
          - id: lignes_de_credit_non_tirees
            libelle: Capacité de financement disponible mais non utilisée
            essentiel: false
        variables_par_archetype:
          rentable:
            mode: variable
            variable: Nombre de mois de charges couverts par la trésorerie nette augmentée du cash généré
          pre_revenus:
            mode: variable
            variable: Trésorerie rapportée à la consommation mensuelle, et positionnée par rapport au prochain jalon clinique
          financiere:
            mode: sans_objet
            motif_gabarit: >-
              L'accès au marché des capitaux fait partie du modèle d'exploitation lui-même ; la
              question se pose en termes de liquidité réglementaire, pas d'autonomie.
            substitut_question_id: qf_4

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  - id: defendabilite
    libelle: Défendabilité / moat
    etape_benchmark: 4
    methodologie: >-
      Porter / Morningstar. Un avantage concurrentiel n'existe que s'il a une source nommée, une
      preuve observable et une trajectoire. Un moat affirmé sans preuve est une opinion.
    nature_dominante: interpretation
    bloc_memo: moat
    questions:

      - id: mo_1
        enonce: Qu'est-ce qui empêche concrètement un concurrent de capter ce profit ?
        chemin_indexation: defendabilite.source_de_la_barriere
        nature_attendue: interpretation
        plancher_tier: B
        motif_plancher: >-
          Sur un champ d'interprétation, un dépôt réglementaire est du boilerplate juridique malgré
          son tier A (convention #50). Le desserrage est DÉCLARÉ, jamais tacite, et n'admet
          personne de nouveau sans passage par le registre nominatif des sources (#52).
        rouverte_par: [surprise_concurrence, reglementaire_favorable, reglementaire_defavorable, accord_commercial]
        sens_admis: [barriere_structurelle, barriere_contestable, aucune_barriere]
        ingredients_requis:
          - id: mecanisme_de_captation
            libelle: Le mécanisme précis par lequel le profit est retenu — ce qu'un concurrent devrait reproduire pour le capter
            essentiel: true
          - id: cout_de_replication
            libelle: Ce qu'il en coûterait à un entrant pour reproduire ce mécanisme, en argent et en temps
            essentiel: true
          - id: tentatives_de_contournement_observees
            libelle: Tentatives réelles de concurrents pour contourner la barrière, et leur issue
            essentiel: false
        variables_par_archetype:
          rentable:
            mode: variable
            variable: Nature de la barrière — coûts de transfert, effets de réseau, avantage de coût, actif incorporel
          pre_revenus:
            mode: variable
            variable: Exclusivité réglementaire et portefeuille de brevets, avec leur durée résiduelle
          financiere:
            mode: variable
            variable: Coût de collecte des ressources et coûts de transfert des clients

      - id: mo_2
        enonce: Quelle preuve observable soutient cette barrière ?
        chemin_indexation: defendabilite.preuve_observable
        nature_attendue: mesure
        plancher_tier: B+
        rouverte_par: [resultats, surprise_concurrence, reglementaire_favorable, accord_commercial]
        sens_admis: [preuve_directe, preuve_indirecte, aucune_preuve]
        ingredients_requis:
          - id: marges_relatives_aux_pairs
            libelle: Niveau de marge comparé à celui d'entreprises comparables, à activité équivalente
            essentiel: true
          - id: evolution_des_parts_de_marche
            libelle: Évolution de la part de marché sur plusieurs périodes
            essentiel: true
          - id: retention_de_la_clientele
            libelle: Part de la clientèle conservée d'une période à l'autre, et valeur conservée
            essentiel: false
          - id: cout_d_acquisition_compare
            libelle: Coût d'acquisition d'un client comparé à celui des concurrents
            essentiel: false
        variables_par_archetype:
          rentable:
            mode: variable
            variable: Rétention nette, part de marché relative et prime de marge face aux pairs
          pre_revenus:
            mode: variable
            variable: Durée de vie résiduelle des brevets et barrière de réplication clinique
          financiere:
            mode: variable
            variable: Coût des ressources collectées comparé aux pairs et attrition de la clientèle

      - id: mo_3
        enonce: La barrière s'élargit-elle ou s'érode-t-elle, et sur quel signal le voit-on ?
        chemin_indexation: defendabilite.trajectoire_de_la_barriere
        nature_attendue: interpretation
        plancher_tier: B
        motif_plancher: >-
          Même desserrage déclaré que mo_1 : la trajectoire d'une barrière se lit dans des
          observations de terrain qu'aucun dépôt réglementaire ne porte.
        rouverte_par: [resultats, surprise_secteur, surprise_concurrence, reglementaire_favorable, incident]
        sens_admis: [en_elargissement, stable, en_erosion]
        ingredients_requis:
          - id: signal_de_trajectoire_nomme
            libelle: L'indicateur précis sur lequel l'élargissement ou l'érosion se lirait en premier
            essentiel: true
          - id: serie_du_signal
            libelle: Ce même indicateur observé sur plusieurs périodes successives
            essentiel: true
          - id: mouvements_concurrents_recents
            libelle: Entrées, sorties et repositionnements de concurrents sur la période récente
            essentiel: false
        variables_par_archetype:
          rentable:
            mode: variable
            variable: Pente du signal retenu, et son écart avec la pente sectorielle
          pre_revenus:
            mode: variable
            variable: Avancement des programmes concurrents vers le même usage thérapeutique
          financiere:
            mode: variable
            variable: Évolution de l'écart de coût des ressources face aux pairs

      - id: mo_4
        enonce: Combien de temps la barrière tient-elle si rien ne change, et quelle classe de référence l'ancre ?
        chemin_indexation: defendabilite.duree_de_la_barriere
        nature_attendue: interpretation
        plancher_tier: B
        motif_plancher: >-
          Même desserrage déclaré que mo_1. La durée d'une barrière est un jugement ancré, pas une
          donnée déposée.
        rouverte_par: [surprise_concurrence, reglementaire_favorable, reglementaire_defavorable]
        sens_admis: [duree_longue, duree_moyenne, duree_courte]
        ingredients_requis:
          - id: classe_de_reference
            libelle: La population d'entreprises comparables dont la durée observée sert d'ancre — obligatoire, une durée sans ancre est une opinion chiffrée
            essentiel: true
          - id: duree_observee_dans_la_classe
            libelle: Durée pendant laquelle des barrières de même nature ont tenu dans cette population
            essentiel: true
          - id: echeances_contractuelles_ou_legales
            libelle: Dates auxquelles une protection contractuelle ou légale s'éteint
            essentiel: false
        variables_par_archetype:
          rentable:
            mode: variable
            variable: Durée retenue, ancrée sur la persistance observée des rendements excédentaires dans la classe de référence
          pre_revenus:
            mode: variable
            variable: Durée résiduelle de l'exclusivité, ancrée sur les taux d'érosion observés après perte d'exclusivité
          financiere:
            mode: variable
            variable: Durée retenue, ancrée sur la stabilité observée des positions de dépôts

      - id: mo_5
        enonce: Qu'est-ce qui détruirait cette barrière, et ce vecteur est-il déjà en mouvement ?
        chemin_indexation: defendabilite.vecteur_de_destruction
        nature_attendue: interpretation
        plancher_tier: B
        motif_plancher: >-
          Même desserrage déclaré que mo_1. Une pré-mortem se nourrit d'observations de terrain,
          jamais du document où l'entreprise décrit ses propres risques.
        rouverte_par: [surprise_concurrence, surprise_execution, reglementaire_favorable, reglementaire_defavorable, accord_commercial, incident]
        sens_admis: [vecteur_en_mouvement, vecteur_latent, aucun_vecteur_identifie]
        ingredients_requis:
          - id: vecteur_nomme
            libelle: Le scénario précis qui ferait disparaître la barrière — nommé, pas une liste de risques génériques
            essentiel: true
          - id: signal_precurseur
            libelle: Ce qu'on observerait en premier si ce scénario était déjà en train de se réaliser
            essentiel: true
          - id: etat_du_signal_precurseur
            libelle: L'état actuel de ce signal, mesuré et daté
            essentiel: true
        variables_par_archetype:
          rentable:
            mode: variable
            variable: Vecteur dominant — rupture technologique, intégration verticale d'un client, changement réglementaire
          pre_revenus:
            mode: variable
            variable: Échec d'un essai, arrivée d'une modalité concurrente, décision réglementaire défavorable
          financiere:
            mode: variable
            variable: Changement d'exigence prudentielle ou désintermédiation de la relation client

      - id: mo_6
        enonce: Le pouvoir de fixation des prix est-il exercé, et supporté par le client ?
        chemin_indexation: defendabilite.pouvoir_de_prix
        nature_attendue: mesure
        plancher_tier: B+
        rouverte_par: [resultats, surprise_concurrence, reglementaire_favorable]
        sens_admis: [pouvoir_exerce_et_absorbe, pouvoir_exerce_avec_resistance, pouvoir_absent]
        ingredients_requis:
          - id: evolution_des_prix_pratiques
            libelle: Évolution des prix effectivement pratiqués sur plusieurs périodes
            essentiel: true
          - id: reaction_des_volumes
            libelle: Comment les volumes ont réagi à ces mouvements de prix
            essentiel: true
          - id: prime_de_prix_face_aux_alternatives
            libelle: Écart de prix soutenu face aux solutions alternatives disponibles
            essentiel: false
        variables_par_archetype:
          rentable:
            mode: variable
            variable: Hausse de prix passée sans perte de volume, et prime soutenue face aux alternatives
          pre_revenus:
            mode: sans_objet
            motif_gabarit: >-
              Aucun prix n'est encore pratiqué. Le pouvoir de prix futur est une hypothèse de
              valorisation, pas une observation de défendabilité.
            aucun_substitut: true
          financiere:
            mode: variable
            variable: Écart soutenu entre le taux servi et le taux de marché, sans fuite des encours

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # Troisième framework, et premier écrit après les pilotes (roadmap 05, capacité 1, 2026-09-28).
  # Co-écrit question par question avec l'utilisateur. Il écarte ce que les deux pilotes portent déjà
  # (preuve de la barrière, conversion en cash, coût de la croissance). Aucune question n'est sans
  # objet pour un émetteur sans ventes : un modèle économique se décrit avant la première vente — on
  # demande alors ce qui est VISÉ (arbitrage du 2026-09-28 : l'information attendue se cherche, son
  # absence ne bloque pas).
  - id: modele_economique
    libelle: Modèle économique
    etape_benchmark: 3
    methodologie: >-
      Écoles « qualité » (Buffett / Fundsmith, Baillie Gifford). Avant de juger la barrière ou les
      chiffres, l'analyste établit comment l'argent est gagné : qui paie et pour quoi, d'où vient
      chaque dollar et ce qui revient sans nouvel effort de vente, ce que rapporte une unité de plus,
      ce qui fait varier l'activité, jusqu'où elle peut croître, et de quoi elle dépend.
    nature_dominante: interpretation
    bloc_memo: business_model
    questions:

      - id: me_1
        enonce: Qui paie, pour quoi, et pourquoi ce client-là plutôt qu'un autre fournisseur ?
        chemin_indexation: modele_economique.proposition_de_valeur
        nature_attendue: interpretation
        plancher_tier: B
        motif_plancher: >-
          Même desserrage déclaré que mo_1 : la raison pour laquelle un client choisit une offre se
          lit dans des observations de terrain, qu'un dépôt réglementaire ne porte qu'en boilerplate.
        rouverte_par: [accord_commercial, reglementaire_favorable, reglementaire_defavorable, surprise_concurrence]
        sens_admis: [proposition_distinctive, proposition_banalisee, proposition_non_etablie]
        ingredients_requis:
          - id: client_payeur
            libelle: Qui paie effectivement — le client qui signe et règle, distinct le cas échéant de l'utilisateur
            essentiel: true
          - id: besoin_servi
            libelle: Le besoin ou le problème que l'offre résout pour ce client payeur
            essentiel: true
          - id: alternatives_du_client
            libelle: Ce que le client utiliserait à défaut — offre concurrente, solution interne, ou ne rien faire
            essentiel: true
          - id: motif_de_choix_observe
            libelle: Raison observée pour laquelle le client choisit cette offre plutôt que l'alternative
            essentiel: false
        variables_par_archetype:
          rentable:
            mode: variable
            variable: Client payeur, besoin servi et alternative écartée, pour chaque ligne d'activité principale
          pre_revenus:
            mode: variable
            variable: Client payeur visé, besoin servi et solution de référence que l'offre remplacerait
          financiere:
            mode: variable
            variable: Clientèle servie — déposants, emprunteurs, assurés — et ce qui lui fait choisir l'établissement

      - id: me_2
        enonce: D'où vient chaque dollar de chiffre d'affaires, et quelle part revient sans nouvel effort de vente ?
        chemin_indexation: modele_economique.sources_de_revenus
        nature_attendue: mesure
        plancher_tier: A
        rouverte_par: [resultats, accord_commercial, integrite_comptes]
        sens_admis: [revenus_recurrents, revenus_mixtes, revenus_transactionnels, revenus_non_etablis]
        ingredients_requis:
          - id: repartition_du_chiffre_d_affaires
            libelle: Répartition du chiffre d'affaires par source — produits, services, zones, catégories de clients
            essentiel: true
          - id: part_engagee_ou_repetee
            libelle: Part du chiffre d'affaires adossée à des contrats, abonnements ou achats répétés, et durée de ces engagements
            essentiel: true
          - id: montant_engage_non_reconnu
            libelle: Montant déjà engagé par les clients et pas encore reconnu en chiffre d'affaires
            essentiel: false
        variables_par_archetype:
          rentable:
            mode: variable
            variable: Répartition du chiffre d'affaires par source et part adossée à des engagements pluriannuels
          pre_revenus:
            mode: variable
            variable: Sources de revenus visées, et revenus déjà perçus hors ventes — collaborations, licences, subventions
          financiere:
            mode: variable
            variable: Répartition des revenus entre marge d'intérêt, commissions et autres produits, et part récurrente

      - id: me_3
        enonce: Que rapporte une unité vendue de plus, une fois payés les coûts qu'elle entraîne ?
        chemin_indexation: modele_economique.economie_unitaire
        nature_attendue: mesure
        plancher_tier: B+
        rouverte_par: [resultats, surprise_secteur, surprise_concurrence, surprise_execution, integrite_comptes]
        sens_admis: [economie_unitaire_forte, economie_unitaire_faible, economie_unitaire_negative, economie_unitaire_non_etablie]
        ingredients_requis:
          - id: prix_par_unite
            libelle: Prix obtenu par unité vendue — produit, abonnement, contrat ou traitement
            essentiel: true
          - id: couts_entraines_par_unite
            libelle: Coûts directement entraînés par une unité vendue de plus — production, livraison, service, redevances
            essentiel: true
          - id: marge_brute_sur_plusieurs_periodes
            libelle: Marge brute de l'activité et son évolution sur plusieurs périodes
            essentiel: false
        variables_par_archetype:
          rentable:
            mode: variable
            variable: Marge dégagée par unité vendue après ses coûts variables, et son évolution
          pre_revenus:
            mode: variable
            variable: Prix visé ou annoncé par unité et coût de production unitaire attendu
          financiere:
            mode: variable
            variable: Marge d'un encours après coût de la ressource et coût du risque

      - id: me_4
        enonce: Quels sont les deux ou trois moteurs qui font varier le chiffre d'affaires ?
        chemin_indexation: modele_economique.moteurs_de_l_activite
        nature_attendue: interpretation
        plancher_tier: B
        motif_plancher: >-
          Nommer les moteurs d'une activité est un raisonnement sur des séries publiées ; les
          explications de la direction et des observateurs en font partie, pas seulement les dépôts.
        rouverte_par: [resultats, surprise_secteur, surprise_concurrence, surprise_execution]
        sens_admis: [moteurs_maitrises, moteurs_subis, moteurs_indetermines]
        ingredients_requis:
          - id: moteurs_nommes
            libelle: Les deux ou trois grandeurs dont les variations expliquent l'essentiel de celles du chiffre d'affaires
            essentiel: true
          - id: part_maitrisee_des_moteurs
            libelle: Part de ces moteurs que l'entreprise contrôle elle-même, par opposition à ceux qu'elle subit — cycle, taux, réglementation
            essentiel: true
          - id: sensibilite_passee
            libelle: Variation passée du chiffre d'affaires rapportée à celle de chacun de ces moteurs
            essentiel: false
        variables_par_archetype:
          rentable:
            mode: variable
            variable: Grandeurs de volume et de prix qui expliquent les variations du chiffre d'affaires
          pre_revenus:
            mode: variable
            variable: Grandeurs qui feront le chiffre d'affaires une fois la vente engagée — population, adoption, prix, prise en charge
          financiere:
            mode: variable
            variable: Niveau des taux, volume des encours et coût du risque

      - id: me_5
        enonce: Jusqu'où l'activité peut-elle croître sur son modèle actuel — quel marché, et quelle part déjà prise ?
        chemin_indexation: modele_economique.espace_de_croissance
        nature_attendue: interpretation
        plancher_tier: B
        motif_plancher: >-
          La taille d'un marché adressable est une estimation, publiée par l'entreprise ou par des
          observateurs ; aucun dépôt réglementaire ne la mesure.
        rouverte_par: [reglementaire_favorable, reglementaire_defavorable]
        sens_admis: [croissance_ample, croissance_bornee, marche_sature]
        ingredients_requis:
          - id: marche_adressable
            libelle: Taille du marché que l'offre actuelle peut servir, avec sa source et sa méthode d'estimation
            essentiel: true
          - id: part_deja_prise
            libelle: Part de ce marché déjà captée par l'entreprise
            essentiel: true
          - id: extensions_engagees
            libelle: Extensions du marché servi que l'entreprise a engagées — nouveaux clients, usages, zones ou indications
            essentiel: false
        variables_par_archetype:
          rentable:
            mode: variable
            variable: Marché adressable par l'offre actuelle et part déjà captée
          pre_revenus:
            mode: variable
            variable: Population ou marché éligible à l'offre, et extensions engagées
          financiere:
            mode: variable
            variable: Part de marché sur les clientèles et territoires servis, et marge de progression

      - id: me_6
        enonce: Le modèle dépend-il d'un client, d'un produit, d'un fournisseur ou d'un pays dont la perte le remettrait en cause ?
        chemin_indexation: modele_economique.dependances_critiques
        nature_attendue: mesure
        plancher_tier: A
        rouverte_par: [accord_commercial, incident]
        sens_admis: [dependance_faible, dependance_notable, dependance_critique]
        ingredients_requis:
          - id: poids_des_premiers_clients
            libelle: Part du chiffre d'affaires réalisée avec les principaux clients
            essentiel: true
          - id: poids_du_premier_produit
            libelle: Part du chiffre d'affaires réalisée par le premier produit ou la première ligne d'activité
            essentiel: true
          - id: fournisseurs_sans_substitut
            libelle: Fournisseurs ou sous-traitants sans substitut rapide, et ce qui dépend d'eux
            essentiel: true
          - id: exposition_par_pays
            libelle: Répartition de l'activité par pays et exposition aux restrictions d'un pays
            essentiel: false
        variables_par_archetype:
          rentable:
            mode: variable
            variable: Poids des premiers clients, du premier produit et des fournisseurs sans substitut
          pre_revenus:
            mode: variable
            variable: Dépendance à un produit unique, à un partenaire ou à un sous-traitant de production
          financiere:
            mode: variable
            variable: Concentration des encours par secteur, par contrepartie et par zone

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # « Secteur et concurrence » — roadmap 05, capacité 2 (2026-09-28), co-écrit avec l'utilisateur.
  # Porter : un bon acteur dans un secteur structurellement pauvre reste un placement médiocre. Il
  # écarte ce que les autres portent déjà : la barrière à l'entrée (mo_1), le pouvoir de prix (mo_6),
  # la taille du marché et la part prise (me_5). Recoupement ACCEPTÉ par l'utilisateur : se_3 mesure
  # le RANG face aux pairs, mo_2 y cherche la PREUVE d'une barrière — même matière, deux usages.
  # C'est le premier framework rouvert par des événements EXTÉRIEURS à l'émetteur (#93).
  # Aucune question n'est sans objet pour un émetteur sans ventes : le secteur et les concurrents
  # existent avant la première vente.
  - id: secteur_concurrence
    libelle: Secteur et concurrence
    etape_benchmark: 7
    methodologie: >-
      Porter (cinq forces) et la pratique de l'analyste sectoriel. L'analyste établit si le secteur
      gagne durablement de l'argent et qui en capte la valeur, comment le marché est partagé, où
      l'entreprise se range face à ses pairs directs, la cyclicité de la demande, ce qui pourrait
      changer les règles du secteur, et ce que font les concurrents en ce moment.
    nature_dominante: interpretation
    bloc_memo: industry
    questions:

      - id: se_1
        enonce: Le secteur dans son ensemble gagne-t-il de l'argent, et qui capte la valeur entre clients, fournisseurs et intermédiaires ?
        chemin_indexation: secteur_concurrence.rentabilite_du_secteur
        nature_attendue: interpretation
        plancher_tier: B
        motif_plancher: >-
          La répartition de la valeur dans une chaîne se lit dans des études sectorielles et des
          comparaisons entre acteurs ; un dépôt de l'émetteur n'en porte que sa propre part.
        rouverte_par: [surprise_secteur, reglementaire_favorable, reglementaire_defavorable, accord_commercial, regulation_du_secteur, concurrent_rapprochement]
        sens_admis: [secteur_structurellement_rentable, secteur_ordinaire, secteur_structurellement_pauvre]
        ingredients_requis:
          - id: rentabilite_des_acteurs
            libelle: Rentabilité des principaux acteurs du secteur sur un cycle complet, pas seulement celle de l'entreprise
            essentiel: true
          - id: pouvoir_des_clients
            libelle: Poids et pouvoir de négociation des clients ou des payeurs — concentration, capacité à imposer leurs prix
            essentiel: true
          - id: pouvoir_des_fournisseurs
            libelle: Poids et pouvoir de négociation des fournisseurs clés — fournisseur unique, intrant rare
            essentiel: true
          - id: intermediaires
            libelle: Intermédiaires entre l'entreprise et le client final, et la part de valeur qu'ils prélèvent
            essentiel: false
        variables_par_archetype:
          rentable:
            mode: variable
            variable: Rentabilité des acteurs du secteur sur un cycle et partage de la valeur avec clients et fournisseurs
          pre_revenus:
            mode: variable
            variable: Rentabilité des offres comparables déjà commercialisées et pouvoir des payeurs qui en fixent le prix
          financiere:
            mode: variable
            variable: Rentabilité des établissements du secteur sur un cycle de crédit et pouvoir des déposants et emprunteurs

      - id: se_2
        enonce: Comment le marché est-il partagé entre les acteurs, et ce partage est-il en train de bouger ?
        chemin_indexation: secteur_concurrence.partage_du_marche
        nature_attendue: mesure
        plancher_tier: B+
        rouverte_par: [resultats, surprise_concurrence, accord_commercial, concurrent_offensive, concurrent_revers, concurrent_rapprochement]
        sens_admis: [marche_concentre, marche_disperse, marche_en_recomposition]
        ingredients_requis:
          - id: acteurs_et_parts
            libelle: Les principaux acteurs du marché et la part que chacun détient, avec la source de l'estimation
            essentiel: true
          - id: evolution_des_parts
            libelle: Évolution de ces parts sur les dernières années — qui gagne, qui perd
            essentiel: true
          - id: entrants_recents
            libelle: Acteurs entrés sur le marché ou sortis de celui-ci récemment
            essentiel: false
        variables_par_archetype:
          rentable:
            mode: variable
            variable: Parts de marché des principaux acteurs et leur évolution sur 3 à 5 ans
          pre_revenus:
            mode: variable
            variable: Offres déjà commercialisées et programmes concurrents sur la même cible, classés par stade d'avancement
          financiere:
            mode: variable
            variable: Parts des établissements sur les encours et les clientèles servies, et leur évolution

      - id: se_3
        enonce: Face à ses pairs directs, l'entreprise fait-elle mieux ou moins bien — croissance, marges, investissement — et l'écart se creuse-t-il ?
        chemin_indexation: secteur_concurrence.rang_face_aux_pairs
        nature_attendue: mesure
        plancher_tier: B+
        rouverte_par: [resultats, surprise_concurrence, surprise_execution, concurrent_offensive, concurrent_revers]
        sens_admis: [devant_ses_pairs, au_niveau_de_ses_pairs, derriere_ses_pairs]
        ingredients_requis:
          - id: pairs_directs
            libelle: Les pairs directs retenus pour la comparaison, et pourquoi ceux-là
            essentiel: true
          - id: indicateurs_compares
            libelle: Croissance, marges et intensité d'investissement de l'entreprise et de chaque pair, sur la même période
            essentiel: true
          - id: evolution_de_l_ecart
            libelle: Évolution de l'écart entre l'entreprise et ses pairs sur plusieurs exercices
            essentiel: false
        variables_par_archetype:
          rentable:
            mode: variable
            variable: Croissance, marges et intensité d'investissement comparées aux pairs directs sur 3 à 5 ans
          pre_revenus:
            mode: variable
            variable: Avancement des essais et années de trésorerie disponibles comparés aux développeurs concurrents sur la même cible
          financiere:
            mode: variable
            variable: Rentabilité des fonds propres, coût du risque et efficacité comparés aux établissements pairs

      - id: se_4
        enonce: La demande qui fait vivre le secteur est-elle cyclique, et où en est-on du cycle aujourd'hui ?
        chemin_indexation: secteur_concurrence.cyclicite
        nature_attendue: interpretation
        plancher_tier: B
        motif_plancher: >-
          La position dans un cycle est un jugement porté sur des séries de demande et des analyses
          sectorielles ; aucun dépôt de l'émetteur ne la déclare.
        rouverte_par: [resultats, surprise_secteur]
        sens_admis: [demande_peu_cyclique, cycle_favorable, cycle_defavorable]
        ingredients_requis:
          - id: historique_de_la_demande
            libelle: Évolution de la demande du secteur sur au moins un cycle complet, creux et pics compris
            essentiel: true
          - id: moteur_du_cycle
            libelle: Ce qui fait tourner le cycle — investissement des clients, crédit, stocks, prix d'une matière
            essentiel: true
          - id: position_actuelle
            libelle: Signaux récents qui situent le secteur dans son cycle — commandes, stocks, capacités, prix
            essentiel: false
        variables_par_archetype:
          rentable:
            mode: variable
            variable: Sensibilité de la demande du secteur au cycle économique et position actuelle dans ce cycle
          pre_revenus:
            mode: variable
            variable: Dépendance aux périodes où le secteur peut lever des fonds, et état actuel de ces conditions de financement
          financiere:
            mode: variable
            variable: Position dans le cycle du crédit et des taux, et sensibilité des résultats à ce cycle

      - id: se_5
        enonce: Qu'est-ce qui pourrait changer les règles du secteur — une technologie qui remplace l'offre, une régulation des prix, un nouveau modèle ?
        chemin_indexation: secteur_concurrence.changement_des_regles
        nature_attendue: interpretation
        plancher_tier: B
        motif_plancher: >-
          Une menace sur le secteur entier s'instruit dans des analyses de la technologie, de la
          régulation et des concurrents ; un dépôt de l'émetteur n'en porte que les facteurs de risque.
        rouverte_par: [surprise_secteur, reglementaire_favorable, reglementaire_defavorable, regulation_du_secteur, concurrent_offensive]
        sens_admis: [regles_stables, menace_identifiee, regles_en_train_de_changer]
        ingredients_requis:
          - id: substituts
            libelle: Offres ou technologies de substitution qui répondent au même besoin autrement, et leur avancement
            essentiel: true
          - id: evolutions_reglementaires
