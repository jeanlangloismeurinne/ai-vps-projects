            mode: variable
            variable: Valeur par action dans trois scénarios de croissance, de marge et de réinvestissement, sur au moins 5 ans
          pre_revenus:
            mode: variable
            variable: Valeur de chaque programme pondérée par sa probabilité de succès, sous trois scénarios de prix, de pénétration et de calendrier, nette de la dilution
          financiere:
            mode: variable
            variable: Valeur par action dans trois scénarios de croissance des encours, de coût du risque et de rendement des fonds propres

      - id: va_3
        enonce: Qu'ont valu, historiquement, des entreprises dans une situation comparable ?
        chemin_indexation: valorisation.classe_de_reference
        nature_attendue: mesure
        plancher_tier: B
        motif_plancher: >-
          Une classe de référence se mesure dans des études et des bases historiques d'observateurs,
          jamais dans les dépôts de l'émetteur.
        rouverte_par: [reglementaire_favorable, reglementaire_defavorable, changement_de_stade]
        sens_admis: [classe_favorable, classe_neutre, classe_defavorable]
        ingredients_requis:
          - id: classe_retenue
            libelle: La classe d'entreprises comparables retenue, et pourquoi celle-là
            essentiel: true
            duree_de_vie: jugement
          - id: distribution_des_issues
            libelle: Distribution observée des issues dans cette classe — croissance réalisée, taux de succès, rendement pour l'actionnaire
            essentiel: true
            duree_de_vie: jugement
          - id: position_dans_la_classe
            libelle: Où les scénarios de l'entreprise se situent dans cette distribution
            essentiel: false
            duree_de_vie: jugement
        chiffres_cles: []
        variables_par_archetype:
          rentable:
            mode: variable
            variable: Croissance et rentabilité réalisées par les entreprises de même taille et même secteur sur 5 à 10 ans
          pre_revenus:
            mode: variable
            variable: Taux de succès et trajectoires commerciales des produits au même stade, dans la même indication
          financiere:
            mode: variable
            variable: Rendement des fonds propres et pertes de crédit observés sur un cycle complet pour des établissements comparables

      - id: va_4
        enonce: Que faut-il croire pour justifier le prix actuel — quelle croissance, quelle rentabilité, sur combien d'années ?
        chemin_indexation: valorisation.ce_que_suppose_le_prix
        nature_attendue: mesure
        plancher_tier: B+
        rouverte_par: [resultats, financement, integrite_comptes, changement_de_stade]
        sens_admis: [attentes_modestes, attentes_exigeantes, attentes_irrealistes]
        ingredients_requis:
          - id: cours_cote_date
            libelle: Dernier cours coté et sa date, et nombre d'actions dilué
            essentiel: true
            duree_de_vie: au_cours_du_jour
          - id: croissance_implicite
            libelle: Croissance et rentabilité que le prix suppose, au coût du capital repris de qf_1
            essentiel: true
            duree_de_vie: au_cours_du_jour
          - id: comparaison_aux_scenarios
            libelle: Position de ces attentes implicites face aux scénarios de va_2 et à la classe de référence de va_3
            essentiel: false
            duree_de_vie: jugement
        chiffres_cles: []
        variables_par_archetype:
          rentable:
            mode: variable
            variable: Croissance et marge implicites dans le prix, et durée pendant laquelle elles doivent tenir
          pre_revenus:
            mode: variable
            variable: Ventes de pointe et probabilité de succès implicites dans le prix
          financiere:
            mode: variable
            variable: Rendement des fonds propres implicite dans le prix rapporté à la valeur comptable

      - id: va_5
        enonce: Le prix est-il élevé ou bas par rapport aux pairs et à l'historique du titre, et l'écart s'explique-t-il ?
        chemin_indexation: valorisation.comparaison_relative
        nature_attendue: mesure
        plancher_tier: B+
        rouverte_par: [resultats, integrite_comptes, changement_de_stade]
        sens_admis: [decote, en_ligne, prime]
        ingredients_requis:
          - id: multiple_pertinent
            libelle: Le multiple pertinent pour ce secteur, et pourquoi celui-là
            essentiel: true
            duree_de_vie: jugement
          - id: comparaison_pairs_et_historique
            libelle: Ce multiple pour l'entreprise, ses pairs directs — ceux de se_3 — et son propre historique, à une même date
            essentiel: true
            duree_de_vie: au_cours_du_jour
          - id: explication_de_l_ecart
            libelle: Ce qui explique l'écart — croissance, rentabilité, risque — au regard des autres méthodologies
            essentiel: false
            duree_de_vie: jugement
