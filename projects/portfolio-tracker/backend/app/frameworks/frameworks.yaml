          pre_revenus:
            mode: variable
            variable: Valeur d'entreprise face aux développeurs comparables au même stade et dans la même indication
          financiere:
            mode: variable
            variable: Prix rapporté à la valeur comptable tangible, face aux pairs et à l'historique

      - id: va_6
        enonce: Quelle marge de sécurité sépare le prix de la fourchette de valeur, et sur quelle hypothèse repose-t-elle surtout ?
        chemin_indexation: valorisation.marge_de_securite
        nature_attendue: mesure
        plancher_tier: B+
        rouverte_par: [resultats, surprise_secteur, surprise_concurrence, surprise_execution, reglementaire_favorable, reglementaire_defavorable, accord_commercial, financement, integrite_comptes, concurrent_offensive, concurrent_revers, surprise_allocation, changement_de_stade]
        sens_admis: [marge_confortable, marge_mince, marge_negative]
        ingredients_requis:
          - id: prix_et_fourchette
