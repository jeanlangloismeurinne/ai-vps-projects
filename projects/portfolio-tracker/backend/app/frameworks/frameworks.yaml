            essentiel: true
            duree_de_vie: au_cours_du_jour
          - id: hypothese_portante
            libelle: L'hypothèse dont dépend surtout la marge, et la marge si elle se révèle fausse
            essentiel: true
            duree_de_vie: jugement
        chiffres_cles: []
        variables_par_archetype:
          rentable:
            mode: variable
