          pre_revenus:
            mode: variable
            variable: Écart entre le cours et la valeur pondérée des programmes, et entre le cours et la trésorerie nette
          financiere:
            mode: variable
            variable: Écart entre le cours et la valeur centrale, et entre le cours et la valeur comptable tangible
