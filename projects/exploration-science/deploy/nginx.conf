server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Prototype under user test: keep it out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Vite hashes every asset name: cache them for good.
    location /assets/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        # `private`: the site sits behind the hub login, no shared cache may keep a copy.
        add_header Cache-Control "private, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The page itself must always be fresh, or a new build is never picked up.
    location / {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
