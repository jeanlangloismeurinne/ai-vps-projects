# Model profiles: which API, which model, with which parameters and prices.
# A step names a profile (pipeline.py); `--profile` overrides it for a run.
# Every field except secrets ends up in the recorded request, so a replay refuses
# a run whose profile changed. Keys never go here: `api_key_env` names the variable
# that holds them (generator/.env, chmod 600).
#
# provider = "anthropic"          -> official Anthropic SDK (the reference)
# provider = "openai-compatible"  -> any Chat Completions API (DeepInfra, …)
# prompt_variant = "<dir>"        -> prompts/<dir>/<file> replaces prompts/<file> when present
# prices: USD per million tokens; a profile without prices has an unknown cost.

[anthropic-opus]
provider = "anthropic"
model = "claude-opus-5-5"
max_tokens = 64000
effort = "high"
api_key_env = "ANTHROPIC_API_KEY"
prices = { input = 4.00, output = 20.00, cache_read = 0.20, cache_write = 5.00 }

["deepinfra-deepseek-v4.1-flash"]
provider = "openai-compatible"
base_url = "https://api.deepinfra.com/v1/openai"
api_key_env = "DEEPINFRA_API_KEY"
# Checked on deepinfra.com/deepseek-ai/DeepSeek-V4.1-Flash/api (2026-10-11): id, OpenAI-compatible endpoint,
# 1,048,576-token context, JSON mode, usage.estimated_cost in every answer.
model = "deepseek-ai/DeepSeek-V4.1-Flash"
max_tokens = 64000
# The answer must be one JSON object: ask the API to enforce it.
json_mode = true
timeout_s = 1800
# The model card recommends temperature 1.0 (top_p 0.95). DeepInfra's Chat Completions take
# reasoning_effort = none | minimal | low | medium | high | xhigh | max (docs.deepinfra.com, 2026-10-11);
# "high" matches the reference profile's effort. The reasoning trace comes apart from the answer.
temperature = 1.0
reasoning_effort = "high"
# List prices of the Standard tier (deepinfra.com, 2026-10-11): a 30 % promotion was running ($0.14 / $0.42 /
# $0.004). The API's own usage.estimated_cost is what gets recorded; these only serve when it is missing.
prices = { input = 0.20, output = 0.60, cache_read = 0.006 }
